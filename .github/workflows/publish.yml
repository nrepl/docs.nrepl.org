name: Publish to GitHub Pages
on:
  push:
    branches: [master]
  # The content lives in the nrepl repo, so rebuild daily to pick up its
  # changes without anyone having to remember to trigger it.
  schedule:
    - cron: "0 5 * * *"
  # Lets the nrepl repo ask for a rebuild as soon as a doc change lands or a
  # release is tagged.
  repository_dispatch:
    types: [docs-updated, release]
  # Allows you to run this workflow manually from the Actions tab, optionally
  # adding a release the same way.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add to the playbook (e.g. v1.9.0)"
permissions:
  contents: read
jobs:
  # Not in the github-pages concurrency group below: GitHub cancels a pending
  # run there when another one queues up, which would lose the tag.
  add-release:
    if: (github.event.client_payload.tag || inputs.tag) && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: master
      # A push made with GITHUB_TOKEN doesn't start another run; the build job
      # below publishes the release.
      - name: Add the release to the playbook
        run: |
          message=$(node add-release.mjs "$TAG")
          if [ -n "$message" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "$message"
            git push origin HEAD:master
          fi
  build:
    needs: add-release
    # Also runs when there was no release to add.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The latest master rather than the commit the run started from, so a
      # build always has the playbook's latest release.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Antora
        run: npm ci
      - name: Generate Site
        run: npx antora antora-playbook.yml
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
