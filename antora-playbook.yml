site:
  title: nREPL
  url: https://docs.nrepl.org/
  start_page: nrepl::index.adoc
  keys:
    google_analytics: 'G-H1N0TJ83PW'
content:
  sources:
  - url: https://github.com/nrepl/nrepl.git
    branches: ['master']
    # The -antora tags carry a corrected copy of a release's docs (broken
    # references and the like), since a release tag can't be changed.
    tags: ['1.0.0-antora', '1.1.0', 'v1.2.0-antora', 'v1.3.1-antora', 'v1.4.0', 'v1.6.0-antora', 'v1.7.0-antora', 'v1.8.0']
    start_path: doc
asciidoc:
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    toc: ~
    page-pagination: ''
  extensions:
  - '@asciidoctor/tabs'
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  # Listed file by file (rather than pointing at the directory) so the tabs
  # extension's stylesheet and script can be pulled straight from the npm
  # package instead of being vendored into the repo.
  supplemental_files:
  - path: css/site-extra.css
    contents: ./supplemental-ui/css/site-extra.css
  - path: img/favicon.ico
    contents: ./supplemental-ui/img/favicon.ico
  - path: partials/head-meta.hbs
    contents: ./supplemental-ui/partials/head-meta.hbs
  - path: partials/header-content.hbs
    contents: ./supplemental-ui/partials/header-content.hbs
  - path: partials/footer-content.hbs
    contents: ./supplemental-ui/partials/footer-content.hbs
  - path: css/vendor/tabs.css
    contents: ./node_modules/@asciidoctor/tabs/dist/css/tabs.css
  - path: js/vendor/tabs.js
    contents: ./node_modules/@asciidoctor/tabs/dist/js/tabs.js
runtime:
  log:
    # Broken xrefs and unresolved includes are warnings; fail the build on them
    # rather than publishing dead links.
    failure_level: warn
output:
  dir: build/site
